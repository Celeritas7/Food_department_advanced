name: Verify app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Existing Vite 8 / React plugin 4 peer mismatch requires this flag.
      - run: npm ci --legacy-peer-deps
      - run: npm run verify
      # Deliberately no deploy, production credentials or hosted SQL.
