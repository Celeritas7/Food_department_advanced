<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking App - Phase 4</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{'cream':'#FDF8F3','terracotta':'#C4704F','sage':'#87A878','charcoal':'#2D3436','warm-gray':'#636E72','light-gray':'#B2BEC3','butter':'#F6E58D','tomato':'#E55039','purple':'#6C5CE7'}}}}</script>
  <style>body{font-family:system-ui;background:#FDF8F3;margin:0}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.fade{animation:fadeIn .3s ease-out}input[type=number]::-webkit-inner-spin-button{opacity:1}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo,useRef,useCallback}=React;
const db=new Dexie('CookingAppDB');
db.version(3).stores({ingredients:'id,name',dishes:'id,name,status',intermediates:'id,name'});
const gid=()=>'id_'+Math.random().toString(36).substr(2,9)+Date.now().toString(36);

// ==================== ICONS ====================
const I={
  Pkg:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16.5 9.4 7.55 4.24M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>,
  Dish:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7M2.1 21.8l6.4-6.3M19 5l-7 7"/></svg>,
  Cart:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
  Layer:()=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65M22 12.65l-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>,
  Plus:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5v14"/></svg>,
  Edit:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>,
  Del:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
  X:()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>,
  Back:()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
  CSV:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/></svg>,
  Check:()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
  Upload:()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
};

// Category emoji mapping
const catEmoji = (cat) => {
  const map = {'Vegetables':'🥬','Fruits':'🍎','Meat':'🥩','Dairy':'🧈','Spices':'🌶️','Carbs':'🍚','Oils and sauces':'🫙','Aroma to dish':'🧄','Cake ingredient':'🧁','Nuts':'🥜','Others':'📦','Daily need':'🧴','Special category':'📎'};
  return map[cat] || '🥫';
};

// ==================== MODAL ====================
const Modal=({open,close,title,ch})=>!open?null:(<div className="fixed inset-0 z-50 flex items-center justify-center p-4"><div className="absolute inset-0 bg-charcoal/50" onClick={close}/><div className="relative w-full max-w-md bg-white rounded-2xl shadow-lg fade max-h-[90vh] overflow-y-auto"><div className="flex justify-between px-6 py-4 border-b sticky top-0 bg-white rounded-t-2xl z-10"><h2 className="font-semibold text-xl">{title}</h2><button onClick={close} className="p-2 rounded-lg text-warm-gray hover:bg-light-gray/30"><I.X/></button></div><div className="px-6 py-4">{ch}</div></div></div>);

// ==================== ENGINE FUNCTIONS ====================
const spg=i=>{if(!i.purchasedAt||!i.shelfLifeDays)return{st:'Unknown',d:null};const e=new Date(i.purchasedAt);e.setDate(e.getDate()+i.shelfLifeDays);const d=Math.ceil((e-new Date())/864e5);return{st:d<0?'Expired':d<=3?'NearExpiry':'Fresh',d}};
const SpBadge=({st,d})=>{const c={Fresh:'bg-sage/20 text-sage',NearExpiry:'bg-butter/40 text-yellow-700',Expired:'bg-tomato/20 text-tomato',Unknown:'bg-light-gray/30 text-warm-gray'}[st]||'bg-light-gray/30';const l={Fresh:'Fresh',NearExpiry:'Soon',Expired:'Expired',Unknown:'?'}[st];return<span className={`text-xs px-2 py-0.5 rounded-full ${c}`}>{l}{d!==null&&` ${d}d`}</span>};
const PriBadge=({p})=>{const c={1:'bg-tomato/10 text-tomato',2:'bg-amber-100 text-amber-700'}[p]||'bg-light-gray/30';const l={1:'Urgent',2:'High',3:'Normal',4:'Low',5:'Someday'}[p];return<span className={`text-xs px-2 py-0.5 rounded-full ${c}`}>{l}</span>};

const chkDish=(d,ings,ints)=>{const im=new Map(ings.map(i=>[i.id,i])),itm=new Map(ints.map(i=>[i.id,i]));if(!d.recipeIngredients?.length&&!d.recipeIntermediates?.length)return{ok:false,ul:true,mi:[],mt:[]};const mi=(d.recipeIngredients||[]).filter(e=>{const i=im.get(e.ingredientId);return!i||i.stockQty<e.qty}).map(e=>im.get(e.ingredientId)?.name||'?');const mt=(d.recipeIntermediates||[]).filter(e=>{const i=itm.get(e.intermediateId);return!i||i.stockQty<e.qty}).map(e=>itm.get(e.intermediateId)?.name||'?');return{ok:!mi.length&&!mt.length,ul:false,mi,mt}};
const chkInt=(t,ings)=>{if(!t.inputIngredients?.length)return{ok:false,ul:true};const im=new Map(ings.map(i=>[i.id,i]));return{ok:!t.inputIngredients.some(e=>{const i=im.get(e.ingredientId);return!i||i.stockQty<e.qtyPerUnit}),ul:false}};

const agg=(dishes,ings,ints)=>{const act=dishes.filter(d=>d.status!=='Cooked'),ir=new Map(),itr=new Map();for(const d of act){for(const e of(d.recipeIngredients||[])){const c=ir.get(e.ingredientId)||{t:0,p:99};c.t+=e.qty;c.p=Math.min(c.p,d.priority);ir.set(e.ingredientId,c)}for(const e of(d.recipeIntermediates||[])){const c=itr.get(e.intermediateId)||{t:0,p:99};c.t+=e.qty;c.p=Math.min(c.p,d.priority);itr.set(e.intermediateId,c)}}const itm=new Map(ints.map(i=>[i.id,i]));for(const[id,r]of itr){const t=itm.get(id);if(!t)continue;const df=Math.max(0,r.t-t.stockQty);if(df>0&&t.inputIngredients)for(const inp of t.inputIngredients){const c=ir.get(inp.ingredientId)||{t:0,p:99};c.t+=inp.qtyPerUnit*df;c.p=Math.min(c.p,r.p);ir.set(inp.ingredientId,c)}}const im=new Map(ings.map(i=>[i.id,i])),list=[];for(const[id,r]of ir){const i=im.get(id);if(!i)continue;const df=Math.max(0,r.t-i.stockQty);list.push({id,nm:i.name,u:i.unit,st:i.stockQty,need:r.t,df,buy:df>0,pri:r.p})}list.sort((a,b)=>a.buy!==b.buy?(a.buy?-1:1):a.pri-b.pri);return{list,toBuy:list.filter(i=>i.buy).length}};

// ==================== INGREDIENT FORM ====================
const IngForm=({init,onSave,onX})=>{const[n,sN]=useState(init?.name||''),[u,sU]=useState(init?.unit||'g'),[s,sS]=useState(init?.stockQty||0),[sh,sSh]=useState(init?.shelfLifeDays||7);const sub=e=>{e.preventDefault();if(!n.trim())return;onSave({name:n.trim(),unit:u,stockQty:s,shelfLifeDays:sh})};return<form onSubmit={sub} className="space-y-4"><div><label className="block text-sm font-medium mb-1">Name</label><input value={n} onChange={e=>sN(e.target.value)} className="w-full px-4 py-2 rounded-lg border"/></div><div><label className="block text-sm font-medium mb-1">Unit</label><select value={u} onChange={e=>sU(e.target.value)} className="w-full px-4 py-2 rounded-lg border">{['g','kg','ml','L','pieces','cups','tbsp','tsp'].map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-medium mb-1">Stock</label><input type="number" value={s} onChange={e=>sS(+e.target.value||0)} className="w-full px-4 py-2 rounded-lg border"/></div><div><label className="block text-sm font-medium mb-1">Shelf Life (days)</label><input type="number" value={sh} onChange={e=>sSh(+e.target.value||1)} className="w-full px-4 py-2 rounded-lg border"/></div><div className="flex gap-3 pt-4 border-t"><button type="button" onClick={onX} className="flex-1 py-2 rounded-lg border">Cancel</button><button type="submit" className="flex-1 py-2 rounded-lg bg-terracotta text-white">{init?'Update':'Add'}</button></div></form>};

// ==================== BUY DIALOG ====================
const BuyDlg=({i,sug,onBuy,onX})=>{const[q,sQ]=useState(sug||1);return<div className="space-y-4"><div className="bg-cream rounded-xl p-4"><h3 className="font-semibold">{i.name}</h3><p className="text-sm text-warm-gray">Current: {i.stockQty} {i.unit}</p></div><div><label className="block text-sm font-medium mb-1">Qty</label><input type="number" value={q} onChange={e=>sQ(+e.target.value||0)} className="w-full px-4 py-2 rounded-lg border text-lg" autoFocus/>{sug&&<p className="text-xs text-sage mt-1">Suggested: {sug}</p>}</div><div className="bg-sage/10 rounded-xl p-4 flex justify-between"><div><span className="text-sm text-warm-gray">Now</span><div className="font-medium">{i.stockQty}</div></div><div className="text-right"><span className="text-sm text-warm-gray">After</span><div className="font-medium text-sage">{(i.stockQty+q).toFixed(1)}</div></div></div><div className="flex gap-3"><button onClick={onX} className="flex-1 py-2 rounded-lg border">Cancel</button><button onClick={()=>q>0&&onBuy(q)} className="flex-1 py-2 rounded-lg bg-terracotta text-white">Buy</button></div></div>};

// ==================== INTERMEDIATE FORM ====================
const IntForm=({init,ings,onSave,onX})=>{const[n,sN]=useState(init?.name||''),[u,sU]=useState(init?.unit||'portions'),[s,sS]=useState(init?.stockQty||0),[inp,sInp]=useState(init?.inputIngredients||[]);const add=()=>{const un=ings.filter(i=>!inp.some(x=>x.ingredientId===i.id));if(un.length)sInp([...inp,{ingredientId:un[0].id,qtyPerUnit:1}])};const sub=e=>{e.preventDefault();if(!n.trim())return;onSave({name:n.trim(),unit:u,stockQty:s,inputIngredients:inp})};return<form onSubmit={sub} className="space-y-4"><div><label className="block text-sm font-medium mb-1">Name</label><input value={n} onChange={e=>sN(e.target.value)} placeholder="e.g., Pizza Dough" className="w-full px-4 py-2 rounded-lg border"/></div><div><label className="block text-sm font-medium mb-1">Unit</label><select value={u} onChange={e=>sU(e.target.value)} className="w-full px-4 py-2 rounded-lg border">{['portions','batches','cups','g','ml'].map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-medium mb-1">Stock</label><input type="number" value={s} onChange={e=>sS(+e.target.value||0)} className="w-full px-4 py-2 rounded-lg border"/></div><div className="border-t pt-4"><div className="flex justify-between mb-2"><span className="text-sm font-medium">Inputs (per 1 {u})</span><button type="button" onClick={add} className="text-sm text-purple flex items-center gap-1"><I.Plus/>Add</button></div>{!inp.length?<p className="text-sm text-amber-600">⚠️ No inputs</p>:<div className="space-y-2">{inp.map((x,i)=>{const ig=ings.find(g=>g.id===x.ingredientId);return<div key={i} className="flex gap-2 items-center"><select value={x.ingredientId} onChange={e=>{const u=[...inp];u[i]={...u[i],ingredientId:e.target.value};sInp(u)}} className="flex-1 px-2 py-1.5 rounded border text-sm">{ings.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select><input type="number" value={x.qtyPerUnit} onChange={e=>{const u=[...inp];u[i]={...u[i],qtyPerUnit:+e.target.value||0};sInp(u)}} className="w-16 px-2 py-1.5 rounded border text-sm text-center"/><span className="text-xs text-warm-gray">{ig?.unit}</span><button type="button" onClick={()=>sInp(inp.filter((_,j)=>j!==i))} className="p-1 text-warm-gray hover:text-tomato"><I.Del/></button></div>})}</div>}</div><div className="flex gap-3 pt-4 border-t"><button type="button" onClick={onX} className="flex-1 py-2 rounded-lg border">Cancel</button><button type="submit" className="flex-1 py-2 rounded-lg bg-purple text-white">{init?'Update':'Add'}</button></div></form>};

// ==================== PREPARE DIALOG ====================
const PrepDlg=({t,ings,onPrep,onX})=>{const[u,sU]=useState(1);const need=(t.inputIngredients||[]).map(x=>({...x,ig:ings.find(i=>i.id===x.ingredientId),tot:x.qtyPerUnit*u}));return<div className="space-y-4"><div className="bg-purple/10 rounded-xl p-4"><h3 className="font-semibold">{t.name}</h3><p className="text-sm text-warm-gray">Stock: {t.stockQty} {t.unit}</p></div><div><label className="block text-sm font-medium mb-1">Units</label><input type="number" value={u} onChange={e=>sU(Math.max(1,+e.target.value||1))} className="w-full px-4 py-2 rounded-lg border text-lg" autoFocus/></div><div className="bg-cream rounded-xl p-4"><p className="text-sm text-warm-gray mb-2">Will deduct:</p><ul className="text-sm space-y-1">{need.map((n,i)=><li key={i} className="flex justify-between"><span>{n.ig?.name}</span><span className="text-warm-gray">-{n.tot}</span></li>)}</ul></div><div className="bg-sage/10 rounded-xl p-4 flex justify-between"><div><span className="text-sm text-warm-gray">Now</span><div className="font-medium">{t.stockQty}</div></div><div className="text-right"><span className="text-sm text-warm-gray">After</span><div className="font-medium text-purple">{t.stockQty+u}</div></div></div><div className="flex gap-3"><button onClick={onX} className="flex-1 py-2 rounded-lg border">Cancel</button><button onClick={()=>onPrep(u)} className="flex-1 py-2 rounded-lg bg-purple text-white">Prepare</button></div></div>};

// ==================== DISH FORM (Add/Edit ingredients) ====================
const DishForm=({init,ings,ints,onSave,onX})=>{
  const[n,sN]=useState(init?.name||'');
  const[p,sP]=useState(init?.priority||3);
  const[country,sCountry]=useState(init?.country||'');
  const[type,sType]=useState(init?.type||'');
  const[ri,sRi]=useState(init?.recipeIngredients||[]);
  const[rt,sRt]=useState(init?.recipeIntermediates||[]);
  
  const addI=()=>{const un=ings.filter(i=>!ri.some(x=>x.ingredientId===i.id));if(un.length)sRi([...ri,{ingredientId:un[0].id,qty:1}])};
  const addT=()=>{const un=ints.filter(i=>!rt.some(x=>x.intermediateId===i.id));if(un.length)sRt([...rt,{intermediateId:un[0].id,qty:1}])};
  const sub=e=>{e.preventDefault();if(!n.trim())return;onSave({name:n.trim(),priority:p,country,type,recipeIngredients:ri,recipeIntermediates:rt})};
  
  return<form onSubmit={sub} className="space-y-4">
    <div><label className="block text-sm font-medium mb-1">Dish Name *</label><input value={n} onChange={e=>sN(e.target.value)} className="w-full px-4 py-2.5 rounded-lg border"/></div>
    <div className="grid grid-cols-2 gap-3">
      <div><label className="block text-sm font-medium mb-1">Priority</label><select value={p} onChange={e=>sP(+e.target.value)} className="w-full px-4 py-2.5 rounded-lg border">{[1,2,3,4,5].map(x=><option key={x} value={x}>{['Urgent','High','Normal','Low','Someday'][x-1]}</option>)}</select></div>
      <div><label className="block text-sm font-medium mb-1">Country</label><input value={country} onChange={e=>sCountry(e.target.value)} placeholder="e.g., Indian" className="w-full px-4 py-2.5 rounded-lg border"/></div>
    </div>
    <div><label className="block text-sm font-medium mb-1">Type</label><input value={type} onChange={e=>sType(e.target.value)} placeholder="e.g., Dessert, Lunch" className="w-full px-4 py-2.5 rounded-lg border"/></div>
    
    <div className="border-t pt-4">
      <div className="flex justify-between mb-2"><span className="text-sm font-medium">Ingredients</span><button type="button" onClick={addI} className="text-sm text-terracotta flex items-center gap-1"><I.Plus/>Add</button></div>
      {!ri.length?<p className="text-sm text-warm-gray">None</p>:<div className="space-y-2">{ri.map((x,i)=>{const ig=ings.find(g=>g.id===x.ingredientId);return<div key={i} className="flex gap-2 items-center"><select value={x.ingredientId} onChange={e=>{const u=[...ri];u[i]={...u[i],ingredientId:e.target.value};sRi(u)}} className="flex-1 px-2 py-1.5 rounded border text-sm">{ings.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select><input type="number" value={x.qty} onChange={e=>{const u=[...ri];u[i]={...u[i],qty:+e.target.value||0};sRi(u)}} className="w-16 px-2 py-1.5 rounded border text-sm text-center"/><span className="text-xs text-warm-gray">{ig?.unit}</span><button type="button" onClick={()=>sRi(ri.filter((_,j)=>j!==i))} className="p-1 text-warm-gray hover:text-tomato"><I.Del/></button></div>})}</div>}
    </div>
    
    <div className="border-t pt-4">
      <div className="flex justify-between mb-2"><span className="text-sm font-medium">Preparations</span><button type="button" onClick={addT} disabled={!ints.length} className="text-sm text-purple flex items-center gap-1 disabled:opacity-50"><I.Plus/>Add</button></div>
      {!rt.length?<p className="text-sm text-warm-gray">{ints.length?'None':'Create preps first'}</p>:<div className="space-y-2">{rt.map((x,i)=>{const it=ints.find(t=>t.id===x.intermediateId);return<div key={i} className="flex gap-2 items-center"><select value={x.intermediateId} onChange={e=>{const u=[...rt];u[i]={...u[i],intermediateId:e.target.value};sRt(u)}} className="flex-1 px-2 py-1.5 rounded border border-purple/30 bg-purple/5 text-sm">{ints.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select><input type="number" value={x.qty} onChange={e=>{const u=[...rt];u[i]={...u[i],qty:+e.target.value||0};sRt(u)}} className="w-16 px-2 py-1.5 rounded border border-purple/30 text-sm text-center"/><span className="text-xs text-warm-gray">{it?.unit}</span><button type="button" onClick={()=>sRt(rt.filter((_,j)=>j!==i))} className="p-1 text-warm-gray hover:text-tomato"><I.Del/></button></div>})}</div>}
    </div>
    
    {!ri.length&&!rt.length&&<p className="text-sm text-amber-600">⚠️ Will be unlinked</p>}
    <div className="flex gap-3 pt-4 border-t"><button type="button" onClick={onX} className="flex-1 py-2.5 rounded-lg border">Cancel</button><button type="submit" className="flex-1 py-2.5 rounded-lg bg-terracotta text-white">{init?'Update':'Add'}</button></div>
  </form>
};

// ==================== DISH DETAIL VIEW (with inline qty/unit editing + CSV) ====================
const DishDetail=({dish,ings,ints,onSave,onBack})=>{
  const[name,sName]=useState(dish.name);
  const[priority,sPriority]=useState(dish.priority);
  const[country,sCountry]=useState(dish.country||'');
  const[type,sType]=useState(dish.type||'');
  const[ri,sRi]=useState(dish.recipeIngredients||[]);
  const[rt,sRt]=useState(dish.recipeIntermediates||[]);
  const[dirty,sDirty]=useState(false);
  const[saving,sSaving]=useState(false);
  const[csvMsg,sCsvMsg]=useState(null);
  const csvRef=useRef(null);
  const units=['g','kg','ml','L','pieces','cups','tbsp','tsp'];
  
  const markDirty=()=>sDirty(true);
  
  // Update qty for an ingredient
  const updateQty=(index,val)=>{
    const u=[...ri];
    u[index]={...u[index],qty:val};
    sRi(u);
    markDirty();
  };
  
  // Update unit override for ingredient in recipe  
  const updateUnit=(index,unit)=>{
    const u=[...ri];
    u[index]={...u[index],unitOverride:unit};
    sRi(u);
    markDirty();
  };
  
  // Remove ingredient
  const removeIng=(index)=>{
    sRi(ri.filter((_,i)=>i!==index));
    markDirty();
  };
  
  // Update intermediate qty
  const updateIntQty=(index,val)=>{
    const u=[...rt];
    u[index]={...u[index],qty:val};
    sRt(u);
    markDirty();
  };
  
  // Remove intermediate
  const removeInt=(index)=>{
    sRt(rt.filter((_,i)=>i!==index));
    markDirty();
  };
  
  // Add intermediate
  const addInt=()=>{
    const un=ints.filter(i=>!rt.some(x=>x.intermediateId===i.id));
    if(un.length){sRt([...rt,{intermediateId:un[0].id,qty:1}]);markDirty();}
  };
  
  // CSV Import
  const handleCSV=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const text=ev.target.result;
      const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
      if(!lines.length){sCsvMsg({type:'error',text:'Empty CSV file'});return;}
      
      // Check if first line is header
      const first=lines[0].split(',');
      const hasHeader=first[0].toLowerCase().includes('ingredient') || first[0].toLowerCase().includes('name');
      const dataLines=hasHeader?lines.slice(1):lines;
      
      const ingMap=new Map(ings.map(i=>[i.name.toLowerCase(),i]));
      let matched=0,notFound=[];
      const updated=[...ri];
      
      for(const line of dataLines){
        // Parse CSV line (handle commas in quoted fields)
        const parts=line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if(!parts||parts.length<2)continue;
        const csvName=parts[0].replace(/"/g,'').trim();
        const csvQty=parseFloat(parts[1].replace(/"/g,'').trim());
        if(!csvName||isNaN(csvQty))continue;
        
        // Find matching ingredient
        const ing=ingMap.get(csvName.toLowerCase());
        if(!ing){notFound.push(csvName);continue;}
        
        // Update existing or note it
        const existingIdx=updated.findIndex(r=>r.ingredientId===ing.id);
        if(existingIdx>=0){
          updated[existingIdx]={...updated[existingIdx],qty:csvQty};
          matched++;
        } else {
          // Ingredient exists in DB but not in recipe - skip (user should add via Edit)
          notFound.push(csvName+' (not in recipe)');
        }
      }
      
      if(matched>0){
        sRi(updated);
        markDirty();
      }
      
      const msg=matched>0?`Updated ${matched} ingredient${matched>1?'s':''}`:'' ;
      const warn=notFound.length?`${notFound.length} not matched: ${notFound.slice(0,3).join(', ')}${notFound.length>3?'...':''}` :'';
      sCsvMsg({type:matched>0?'success':'error', text:[msg,warn].filter(Boolean).join('. ')});
      setTimeout(()=>sCsvMsg(null),5000);
    };
    reader.readAsText(file);
    e.target.value='';
  };
  
  // Save all changes
  const save=async()=>{
    if(!name.trim())return;
    sSaving(true);
    await onSave(dish.id,{name:name.trim(),priority,country,type,recipeIngredients:ri,recipeIntermediates:rt});
    sDirty(false);
    sSaving(false);

  const intMap=new Map(ints.map(i=>[i.id,i]));

          <I.Check/>{saving?'Saving...':'Save'}
        </button>}
      </div>
    </header>
    
    <main className="max-w-lg mx-auto px-4 py-5 space-y-5">

        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-medium text-warm-gray mb-1">Priority</label>
            <select value={priority} onChange={e=>{sPriority(+e.target.value);markDirty()}} className="w-full px-3 py-2.5 rounded-lg border border-light-gray/40 focus:outline-none focus:ring-2 focus:ring-terracotta/30">
              {[1,2,3,4,5].map(x=><option key={x} value={x}>{['Urgent','High','Normal','Low','Someday'][x-1]}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-warm-gray mb-1">Country</label>
            <input value={country} onChange={e=>{sCountry(e.target.value);markDirty()}} placeholder="e.g., Indian" className="w-full px-3 py-2.5 rounded-lg border border-light-gray/40 focus:outline-none focus:ring-2 focus:ring-terracotta/30"/>
          </div>
        </div>
        <div>
          <label className="block text-xs font-medium text-warm-gray mb-1">Type</label>
          <input value={type} onChange={e=>{sType(e.target.value);markDirty()}} placeholder="e.g., Dessert" className="w-full px-3 py-2.5 rounded-lg border border-light-gray/40 focus:outline-none focus:ring-2 focus:ring-terracotta/30"/>
        </div>
      </div>
      
      {/* Ingredients Section */}
      <div className="bg-white rounded-xl border fade">
        <div className="px-4 py-3 border-b flex items-center justify-between">
          <span className="font-medium flex items-center gap-2">
            🥕 Ingredients ({ri.length})
          </span>
          <div className="flex items-center gap-2">
            <input type="file" ref={csvRef} accept=".csv" onChange={handleCSV} className="hidden"/>
            <button onClick={()=>csvRef.current?.click()} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-light-gray/40 text-sm text-warm-gray hover:bg-light-gray/10 hover:text-charcoal" title="Import quantities from CSV">
              <I.CSV/><span>CSV</span>
            </button>
          </div>
        </div>
        
        {csvMsg&&<div className={`mx-4 mt-3 px-3 py-2 rounded-lg text-sm ${csvMsg.type==='success'?'bg-sage/15 text-sage':'bg-tomato/10 text-tomato'}`}>{csvMsg.text}</div>}
        
        {ri.length===0?
          <div className="px-4 py-8 text-center text-warm-gray text-sm">No ingredients added</div>
        :
          <div className="divide-y divide-light-gray/20">
            {ri.map((entry,idx)=>{
              const ig=ingMap.get(entry.ingredientId);
              if(!ig)return null;
              const displayUnit=entry.unitOverride||ig.unit||'g';
              return<div key={idx} className="px-4 py-3 flex items-center gap-3 hover:bg-cream/50 transition-colors">
                <span className="text-lg w-7 text-center flex-shrink-0">{catEmoji(ig.category)}</span>
                <span className="flex-1 text-sm font-medium text-charcoal truncate">{ig.name}</span>
                <div className="flex items-center gap-1.5 flex-shrink-0">
                  <input 
                    type="number"

                    className="w-16 px-2 py-1.5 rounded-lg border border-terracotta/30 text-sm text-right text-terracotta font-medium focus:outline-none focus:ring-2 focus:ring-terracotta/30 bg-terracotta/5"
                    min="0"
                    step="any"
                  />
                  <select 
                    value={displayUnit}
                    onChange={e=>updateUnit(idx,e.target.value)}
                    className="px-1.5 py-1.5 rounded-lg border border-light-gray/40 text-xs text-warm-gray bg-white focus:outline-none focus:ring-2 focus:ring-terracotta/30 cursor-pointer"
                  >
                    {units.map(u=><option key={u} value={u}>{u}</option>)}
                  </select>
                  <button onClick={()=>removeIng(idx)} className="p-1.5 rounded-lg text-light-gray hover:text-tomato hover:bg-tomato/10 transition-colors"><I.Del/></button>
                </div>
              </div>
            })}
          </div>
        }
      </div>
      
      {/* Preparations Section */}
      <div className="bg-white rounded-xl border fade">
        <div className="px-4 py-3 border-b flex items-center justify-between">
          <span className="font-medium flex items-center gap-2">
            🧑‍🍳 Preparations ({rt.length})
          </span>
          <button onClick={addInt} disabled={!ints.length} className="flex items-center gap-1 text-sm text-purple disabled:opacity-40">+ Add</button>
        </div>
        
        {rt.length===0?
          <div className="px-4 py-6 text-center text-warm-gray text-sm">None</div>
        :
          <div className="divide-y divide-light-gray/20">
            {rt.map((entry,idx)=>{
              const it=intMap.get(entry.intermediateId);
              if(!it)return null;
              return<div key={idx} className="px-4 py-3 flex items-center gap-3 hover:bg-purple/5 transition-colors">
                <span className="text-lg w-7 text-center flex-shrink-0">🍳</span>
                <span className="flex-1 text-sm font-medium text-charcoal truncate">{it.name}</span>
                <div className="flex items-center gap-1.5 flex-shrink-0">
                  <input 
                    type="number" 
                    value={entry.qty} 
                    onChange={e=>updateIntQty(idx,+e.target.value||0)} 
                    className="w-16 px-2 py-1.5 rounded-lg border border-purple/30 text-sm text-right text-purple font-medium focus:outline-none focus:ring-2 focus:ring-purple/30 bg-purple/5"
                    min="0"
                  />
                  <span className="text-xs text-warm-gray px-1">{it.unit}</span>
                  <button onClick={()=>removeInt(idx)} className="p-1.5 rounded-lg text-light-gray hover:text-tomato hover:bg-tomato/10 transition-colors"><I.Del/></button>
                </div>
              </div>
            })}
          </div>
        }
      </div>
      
      {/* CSV Format Info */}
      <div className="text-xs text-warm-gray bg-white/60 rounded-xl p-3 border border-dashed border-light-gray/40">
        <p className="font-medium mb-1">📋 CSV format for importing quantities:</p>
        <code className="block bg-cream/80 rounded px-2 py-1 text-charcoal">ingredient_name,qty<br/>Orange,200<br/>Eggs,120</code>
        <p className="mt-1">Names must match your ingredients exactly.</p>
      </div>
      
    </main>
    
    {/* Sticky Save Bar */}
    {dirty&&<div className="fixed bottom-16 left-0 right-0 z-20 px-4 pb-3">
      <div className="max-w-lg mx-auto">
        <button onClick={save} disabled={saving} className="w-full py-3 rounded-xl bg-terracotta text-white font-medium shadow-lg shadow-terracotta/20 flex items-center justify-center gap-2 disabled:opacity-60">
          <I.Check/>{saving?'Saving...':'Save Changes'}
        </button>
      </div>
    </div>}
  </div>
};

// ==================== MAIN APP ====================
const App=()=>{
  const[pg,sPg]=useState('ing'),[ings,sIngs]=useState([]),[dishes,sDishes]=useState([]),[ints,sInts]=useState([]),[ld,sLd]=useState(true),[m,sM]=useState({});
  const[detailDish,sDetailDish]=useState(null); // For dish detail view
  
  useEffect(()=>{(async()=>{sIngs(await db.ingredients.toArray());sDishes(await db.dishes.toArray());sInts(await db.intermediates.toArray());sLd(false)})()},[]);
  const eIngs=useMemo(()=>ings.map(i=>({...i,inStock:i.stockQty>0,...spg(i)})),[ings]);

  const editIng=async(id,d)=>{await db.ingredients.update(id,d);sIngs(ings.map(i=>i.id===id?{...i,...d}:i))};
  const delIng=async id=>{await db.ingredients.delete(id);sIngs(ings.filter(i=>i.id!==id))};
  const buyIng=async(id,q)=>{const u={stockQty:(ings.find(i=>i.id===id)?.stockQty||0)+q,purchasedAt:new Date().toISOString()};await db.ingredients.update(id,u);sIngs(ings.map(i=>i.id===id?{...i,...u}:i))};

  const addInt=async d=>{const t={id:gid(),...d};await db.intermediates.add(t);sInts([...ints,t])};
  const editInt=async(id,d)=>{await db.intermediates.update(id,d);sInts(ints.map(t=>t.id===id?{...t,...d}:t))};
  const delInt=async id=>{await db.intermediates.delete(id);sInts(ints.filter(t=>t.id!==id))};

ray hover:text-tomato"><I.Del/></button></div></div>)}</div>}</main></div>;

  const DishPg=()=>{const[f,sF]=useState('active');const fd=useMemo(()=>{let r=eDishes;if(f==='active')r=r.filter(d=>d.isActive);else if(f==='ready')r=r.filter(d=>d.isActive&&d.ok);else if(f==='cooked')r=r.filter(d=>!d.isActive);return r.sort((a,b)=>a.isActive===b.isActive?a.priority-b.priority:a.isActive?-1:1)},[eDishes,f]);return<div className="min-h-screen bg-cream pb-24"><header className="bg-white border-b sticky top-0 z-10"><div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-terracotta/10 flex items-center justify-center text-terracotta"><I.Dish/></div><div><h1 className="font-semibold text-xl">Dishes</h1><p className="text-sm text-warm-gray">Plan & cook</p></div></div><button onClick={()=>sM({t:'addDish'})} className="p-2.5 rounded-lg bg-terracotta text-white"><I.Plus/></button></div></header><main className="max-w-4xl mx-auto px-4 py-6"><div className="flex gap-2 mb-6">{['active','ready','all','cooked'].map(x=><button key={x} onClick={()=>sF(x)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${f===x?'bg-terracotta text-white':'bg-white text-warm-gray'}`}>{x[0].toUpperCase()+x.slice(1)}</button>)}</div>{!fd.length?<p className="text-center py-16 text-warm-gray">{dishes.length?'No match':'No dishes'}</p>:<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{fd.map(d=><div key={d.id} onClick={()=>sDetailDish(d)} className={`bg-white rounded-xl border p-4 fade cursor-pointer hover:shadow-md transition-shadow ${!d.isActive&&'opacity-60'}`}><div className="flex justify-between"><div><h3 className="font-semibold">{d.name}</h3><div className="flex gap-2 mt-1"><span className={`text-xs px-2 py-0.5 rounded-full ${d.status==='Cooked'?'bg-sage/20 text-sage':'bg-blue-100 text-blue-700'}`}>{d.status}</span><PriBadge p={d.priority}/></div></div></div>{d.isActive&&<p className="text-xs mt-2">{d.ul?<span className="text-amber-600">⚠️ Unlinked</span>:d.ok?<span className="text-sage">✔ Ready</span>:<span className="text-tomato">Missing: {[...d.mi,...d.mt].join(', ')}</span>}</p>}<p className="text-xs text-warm-gray mt-2">{(d.recipeIngredients?.length||0)} ing, {(d.recipeIntermediates?.length||0)} prep</p><div className="flex gap-1 mt-3 pt-3 border-t" onClick={e=>e.stopPropagation()}>{d.isActive&&<button onClick={()=>sM({t:'cookDish',d})} disabled={!d.ok} className={`flex-1 py-1.5 rounded text-sm ${d.ok?'text-sage hover:bg-sage/10':'text-light-gray cursor-not-allowed'}`}>Cook</button>}<button onClick={()=>sDetailDish(d)} className="p-1.5 rounded text-warm-gray hover:bg-light-gray/20"><I.Edit/></button><button onClick={()=>{if(confirm(`Delete ${d.name}?`))delDish(d.id)}} className="p-1.5 rounded text-warm-gray hover:text-tomato"><I.Del/></button></div></div>)}</div>}</main></div>};

  const ShopPg=()=>{const[all,sAll]=useState(false);const ls=all?shop.list:shop.list.filter(i=>i.buy);return<div className="min-h-screen bg-cream pb-24"><header className="bg-white border-b sticky top-0 z-10"><div className="max-w-4xl mx-auto px-4 py-4"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-terracotta/10 flex items-center justify-center text-terracotta"><I.Cart/></div><div><h1 className="font-semibold text-xl">Shopping</h1><p className="text-sm text-warm-gray">Auto-generated</p></div></div>{shop.list.length>0&&<div className="mt-3 flex gap-3"><span className="text-sm px-3 py-1 rounded-full bg-tomato/10 text-tomato">{shop.toBuy} to buy</span><span className="text-sm px-3 py-1 rounded-full bg-sage/20 text-sage">{shop.list.length-shop.toBuy} ok</span></div>}</div></header><main className="max-w-4xl mx-auto px-4 py-6">{!shop.list.length?<p className="text-center py-16 text-warm-gray">Add dishes to see list</p>:<><div className="flex gap-2 mb-6"><button onClick={()=>sAll(false)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${!all?'bg-terracotta text-white':'bg-white text-warm-gray'}`}>To Buy ({shop.toBuy})</button><button onClick={()=>sAll(true)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${all?'bg-terracotta text-white':'bg-white text-warm-gray'}`}>All ({shop.list.length})</button></div><div className="space-y-3">{ls.map(i=><div key={i.id} className={`bg-white rounded-xl border p-4 ${i.buy?'border-tomato/30':'border-sage/30'}`}><div className="flex items-center gap-3"><div className="flex-1"><div className="flex items-center gap-2"><h3 className={`font-semibold ${!i.buy&&'text-warm-gray line-through'}`}>{i.nm}</h3><PriBadge p={i.pri}/></div><div className="flex gap-4 text-sm mt-1"><span>Have: <b>{i.st}</b></span><span>Need: <b>{i.need}</b></span>{i.buy&&<span className="text-tomato font-medium">Buy: {i.df}</span>}</div></div>{i.buy&&<button onClick={()=>{const ig=eIngs.find(x=>x.id===i.id);if(ig)sM({t:'buyIng',d:ig,sug:i.df})}} className="px-3 py-1.5 rounded-lg bg-terracotta text-white text-sm">Buy</button>}</div></div>)}{!ls.length&&<p className="text-center py-8 text-warm-gray">🎉 All set!</p>}</div></>}</main></div>};

  return<div>
    {pg==='ing'&&<IngPg/>}{pg==='int'&&<IntPg/>}{pg==='dish'&&<DishPg/>}{pg==='shop'&&<ShopPg/>}
    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t z-20"><div className="max-w-4xl mx-auto flex justify-around">
      <button onClick={()=>sPg('ing')} className={`flex flex-col items-center gap-0.5 py-2 px-2 ${pg==='ing'?'text-terracotta':'text-warm-gray'}`}><I.Pkg/><span className="text-xs">Ingredients</span></button>
      <button onClick={()=>sPg('int')} className={`flex flex-col items-center gap-0.5 py-2 px-2 ${pg==='int'?'text-purple':'text-warm-gray'}`}><I.Layer/><span className="text-xs">Preps</span></button>
      <button onClick={()=>sPg('dish')} className={`flex flex-col items-center gap-0.5 py-2 px-2 ${pg==='dish'?'text-terracotta':'text-warm-gray'}`}><I.Dish/><span className="text-xs">Dishes</span></button>
      <button onClick={()=>sPg('shop')} className={`flex flex-col items-center gap-0.5 py-2 px-2 relative ${pg==='shop'?'text-terracotta':'text-warm-gray'}`}><I.Cart/><span className="text-xs">Shop</span>{shop.toBuy>0&&<span className="absolute top-1 right-0 w-4 h-4 bg-tomato text-white text-xs rounded-full flex items-center justify-center">{shop.toBuy}</span>}</button>
    </div></nav>
    <Modal open={m.t==='addIng'} close={()=>sM({})} title="Add Ingredient" ch={<IngForm onSave={d=>{addIng(d);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='editIng'} close={()=>sM({})} title="Edit Ingredient" ch={m.d&&<IngForm init={m.d} onSave={d=>{editIng(m.d.id,d);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='buyIng'} close={()=>sM({})} title="Buy" ch={m.d&&<BuyDlg i={m.d} sug={m.sug} onBuy={q=>{buyIng(m.d.id,q);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='addInt'} close={()=>sM({})} title="Add Preparation" ch={<IntForm ings={eIngs} onSave={d=>{addInt(d);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='editInt'} close={()=>sM({})} title="Edit Preparation" ch={m.d&&<IntForm init={m.d} ings={eIngs} onSave={d=>{editInt(m.d.id,d);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='prepInt'} close={()=>sM({})} title="Prepare" ch={m.d&&<PrepDlg t={m.d} ings={eIngs} onPrep={u=>{prepInt(m.d.id,u);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='addDish'} close={()=>sM({})} title="Add Dish" ch={<DishForm ings={eIngs} ints={eInts} onSave={d=>{addDish(d);sM({})}} onX={()=>sM({})}/>}/>
    <Modal open={m.t==='cookDish'} close={()=>sM({})} title="Cook" ch={m.d&&<div className="space-y-4"><div className="bg-sage/10 rounded-xl p-4"><h3 className="font-semibold">{m.d.name}</h3><p className="text-sm text-warm-gray mt-2">Will deduct:</p><ul className="text-sm mt-1 space-y-1">{(m.d.recipeIngredients||[]).map(e=>{const i=ings.find(x=>x.id===e.ingredientId);return<li key={e.ingredientId}>{i?.name}: -{e.qty}</li>})}{(m.d.recipeIntermediates||[]).map(e=>{const t=ints.find(x=>x.id===e.intermediateId);return<li key={e.intermediateId} className="text-purple">{t?.name}: -{e.qty}</li>})}</ul></div><div className="flex gap-3"><button onClick={()=>sM({})} className="flex-1 py-2 rounded-lg border">Cancel</button><button onClick={()=>{cookDish(m.d.id);sM({})}} className="flex-1 py-2 rounded-lg bg-sage text-white">Cook</button></div></div>}/>
  </div>
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
